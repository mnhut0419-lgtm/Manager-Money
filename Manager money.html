<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quản Lý Chi Tiêu</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            min-height: 100vh; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            color: #333;
        }
        .header-container { display: flex; justify-content: space-between; width: 100%; max-width: 900px; align-items: center; }
        h1 { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); letter-spacing: 1px; margin: 0; }
        .logout-btn { background: #ff6b6b; padding: 8px 16px; border-radius: 15px; color: white; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(255,107,107,0.4); display: none; }
        .logout-btn:hover { background: #ee5253; }
        .main-layout { display: flex; gap: 20px; width: 100%; max-width: 900px; margin-top: 20px; }
        .left-col { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .right-col { width: 350px; background: rgba(255, 255, 255, 0.85); border-radius: 20px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); backdrop-filter: blur(10px); display: flex; flex-direction: column; max-height: 520px; overflow: hidden; }
        .dashboard { display: flex; gap: 15px; width: 100%; }
        .card { padding: 15px; border-radius: 20px; flex: 1; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-5px); } 
        .card:nth-child(1) { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); } 
        .card:nth-child(2) { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); } 
        .card:nth-child(3) { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); } 
        .card h3 { margin: 0 0 8px 0; color: rgba(255,255,255,0.9); font-size: 1em; }
        .card h2 { margin: 0; color: white; font-size: 1.3em; }
        .chat-container { background: rgba(255, 255, 255, 0.85); width: 100%; height: 420px; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.15); overflow: hidden; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .user-msg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background: white; color: #2d3436; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #eee; }
        .input-area { display: flex; padding: 12px; border-top: 1px solid rgba(0,0,0,0.05); background: rgba(255,255,255,0.95); }
        input[type="text"] { flex: 1; padding: 10px 15px; border: 2px solid #e2e8f0; border-radius: 20px; outline: none; font-size: 14px; }
        button.send-btn { padding: 8px 20px; margin-left: 8px; border: none; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .history-item { padding: 10px; border-radius: 10px; background: white; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #ccc; }
        .history-item.thu { border-left-color: #38ef7d; }
        .history-item.chi { border-left-color: #ff6b6b; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(6px); }
        .modal-content { background: white; padding: 30px; border-radius: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); position: relative; overflow: hidden; }
        .modal-content::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, #ff9a9e, #a18cd1, #8fd3f4); }
        .modal-content h2 { margin-top: 0; color: #2d3436; font-size: 1.5em; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #636e72; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 2px solid #dfe6e9; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        .modal-content button.action-btn { width: 100%; margin-top: 10px; font-size: 16px; padding: 12px; border-radius: 12px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>AI Quản Lý Chi Tiêu</h1>
        <button id="logout-btn" class="logout-btn" onclick="logout()">Đăng Xuất</button>
    </div>

    <div class="main-layout">
        <div class="left-col">
            <div class="dashboard">
                <div class="card">
                    <h3>Tiền Mặt</h3>
                    <h2 id="tien-mat">0 đ</h2>
                </div>
                <div class="card">
                    <h3>Tiền Tài khoản</h3>
                    <h2 id="tien-tk">0 đ</h2>
                </div>
                <div class="card">
                    <h3>Tổng Tiền</h3>
                    <h2 id="tong-tien">0 đ</h2>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-history" id="chat-history">
                    <div class="message ai-msg">Chào bạn! Hãy nhập chi tiêu hôm nay.</div>
                </div>
                <div class="input-area">
                    <input type="text" id="chat-input" placeholder="Nhập giao dịch..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">Gửi</button>
                </div>
            </div>
        </div>

        <div class="right-col">
            <h3 style="margin-top: 0; color: #2d3436;">Lịch Sử Giao Dịch</h3>
            <div class="history-list" id="history-list">
                <p style="color: #888; font-size: 13px; text-align: center;">Chưa có giao dịch nào.</p>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="auth-title">Đăng Nhập</h2>
            <div class="input-group">
                <label>Tài khoản:</label>
                <input type="text" id="auth-user">
            </div>
            <div class="input-group">
                <label>Mật khẩu:</label>
                <input type="password" id="auth-pass">
            </div>
            <button class="action-btn" onclick="handleAuth()" id="auth-btn">Đăng Nhập</button>
            <p style="margin-top: 15px; cursor: pointer; color: #6c5ce7; font-weight: 600; font-size: 14px;" onclick="toggleAuthMode()" id="auth-switch">Chưa có tài khoản? Đăng ký ngay</p>
        </div>
    </div>

    <div id="welcome-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Thiết Lập Số Dư</h2>
            <p style="font-size: 14px;">Nhập số tiền hiện tại của bạn.</p>
            <div class="input-group">
                <label>Tiền Mặt:</label>
                <input type="number" id="init-cash" value="0">
            </div>
            <div class="input-group">
                <label>Tiền Tài Khoản:</label>
                <input type="number" id="init-bank" value="0">
            </div>
            <button class="action-btn" onclick="xacNhanSoDu()">Bắt đầu</button>
        </div>
    </div>

    <script src="manager money.js"></script>
</body>
</html>
